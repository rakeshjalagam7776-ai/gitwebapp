trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroup: 'Gitwebapp'
  appServicePlan: 'Gitwebapp'
  appName: 'Gitwebapp'

steps:
- checkout: self

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Gitwebapp'   # must match service connection name
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az group create --name $(resourceGroup) --location centralus
      az appservice plan create --name $(appServicePlan) --resource-group $(resourceGroup) --sku F1 --is-linux
      az webapp create --resource-group $(resourceGroup) --plan $(appServicePlan) --name $(appName) --runtime "NODE|20-lts"

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build || echo "No build step"
  displayName: 'Install dependencies and build'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Gitwebapp'
    appName: '$(appName)'
    package: '$(Pipeline.Workspace)/drop/drop.zip'
